# Condenser double-deflector (beam shift / tilt between CL3 and C_mini).
# z_m is the upper (1st) deflector; the lower (2nd) sits at z_m + spacing_m.
# Dc is the deflection constant: alpha = Dc * N * I / sqrt(V*) [rad].
# Balance ratios solved by condenser_deflector_design notebook.
