[beam]
# The source is represents a virtual source where the beam appears to come 
# from at the top of the column. 
voltage_kV = 200
virtual_source_diameter_nm = 10.0
source_half_angle_mrad = 0.05
z_source_m = 0.0

[microscope]
# Global component order along +z (first component after source -> detector).
# This includes active and passive components.

[microscope.components]

# Each lens object contains both geometry (absolute z) and optics.
# Gc uses: 1/f = Gc * (N*I)^2

[lenses.CL1]
z_m = 0.2000000000000000
turns = 3000
Gc = 8.0e-6

[lenses.CL3]
z_m = 0.2400000000000000
turns = 3600
Gc = 4.0e-6

[apertures.C_aperture]
name = "C aperture"
z_m = 0.2500000000000000
radii_m = [10e-6, 20e-6, 30e-6, 50e-6, 80e-6, 100e-6, 150e-6] # um

# Condenser double-deflector (beam shift / tilt between CL3 and C_mini).
# z_m is the upper (1st) deflector; the lower (2nd) sits at z_m + spacing_m.
# Dc is the deflection constant: alpha = Dc * N * I / sqrt(V*) [rad].
# Balance ratios solved by condenser_deflector_design notebook.
[deflectors.CL12_deflector]
z_m = 0.2900000000000000
spacing_m = 0.005
turns = 1
Dc = 1.0
shift_balance_x = -1.0
shift_balance_y = -1.0
tilt_balance_x = 1.0
tilt_balance_y = 1.0

[lenses.C_mini]
z_m = 0.3000000000000000
turns = 2000
Gc = 5.0e-5

[lenses.Obj_prefield]
z_m = 0.3200000000000000
turns = 3000
Gc = 2.22222e-5

[sample]
name = "Sample"
z_m = 0.3250000000000000
type = "random_phase"
strength = 5.0
width_m = 200e-9
height_m = 200e-9
correlation_length_m = 5e-9
edge_sharpness = 5e6

[lenses.Obj_post]
z_m = 0.3273000000000000
turns = 3000
Gc = 8.0e-6
# Optional static stigmator strengths (axis-aligned, fractional focal split).
# f_x = f / (1 + stigmator_strength_x), f_y = f / (1 + stigmator_strength_y)
stigmator_strength_x = 0.0
stigmator_strength_y = 0.0

