# Synthetic starting point for the NEOARM inversion notebook.
#
# Values marked "initial" are deliberately not asserted to be factory or
# measured NEOARM field parameters.  Replace them with the geometry notebook
# estimates and the specimen certificate before an instrument run.

[beam]
voltage_v = 200000.0
source_z_m = 0.0
sample_z_m = 0.325
corrector_enabled = false

# The entrance distribution is a synthetic calibration contract, not a gun
# specification.  On the instrument these moments must come from an upstream
# source/deflector calibration or be fitted as nuisance parameters.  A state
# declared only at the specimen cannot identify CL1, CL3, or C-mini.
[beam.entrance_calibration]
mean_state_x_thetax_y_thetay = [0.0, 0.0, 0.0, 0.0]
# For this matched synthetic truth only, these reference sample-plane moments
# are back-propagated once through the nominal condenser to create and then
# freeze a correlated entrance covariance.  A real run substitutes its
# independently calibrated entrance covariance (or releases it as a nuisance).
reference_sample_sigma_position_xy_m = [60e-9, 60e-9]
reference_sample_sigma_tilt_xy_rad = [0.5e-6, 0.5e-6]
# Keeps the calibrated position response detector-visible from 40 kx through
# 600 kx (0.2--3.0 mm at the detector, or about 4--55 Medipix pixels).
position_basis_step_m = 5.0e-9
tilt_basis_step_rad = 1.0e-6

# A known circular condenser aperture provides the absolute geometrical anchor
# that lens-current readback supplied in the reference paper.  Its transmitted
# detector counts are fitted directly against raw DAC after gain/dose
# calibration.  The plane lies in the nominal CL1--CL3 drift gap and must stay
# there throughout the allowed geometry bounds.
[beam.condenser_aperture]
z_m = 0.225
radius_m = 0.5e-6
incident_electrons_per_frame = 2.0e7
dark_offset_e_per_pixel = 0.0

[detector]
z_m = 1.04375
shape_yx = [256, 256]
pixel_size_yx_m = [55e-6, 55e-6]
mtf_sigma_px = 0.65
# High-count synthetic calibration exposure used by the fast 230-frame
# surrogate. Physical Gaussian renders retain their own incident-beam scale.
surrogate_dose_electrons = 2.0e7
surrogate_read_noise_e = 0.6
# Effective specimen-plane defocus used only by the fast weak-phase surrogate.
# The physical Gaussian/grid validation uses its explicit propagation distance.
surrogate_phase_contrast_defocus_m = 10e-9
diffraction_camera_length_m = 0.10

[sample]
identity = "MAGICAL-like-synthetic-pilot"
# Small, explicit nominal pose used to exercise the same analytic coordinate
# transform that will consume the measured holder/stage pose on-instrument.
pose_translation_xy_m = [2.0e-9, -1.0e-9]
pose_rotation_deg = 3.25
pose_tilt_xy_mrad = [1.2, -0.8]
boundary_default = "vacuum"
interpolation = "cubic2"
interpolation_halo_px = 4
# The wide regional rasters must resolve the back-projected detector sampling
# even when a broad Gaussian support envelope extends beyond the compact,
# high-density four-repeat tile (the 147k IL2-minus state is the limiting case).
region_shape_yx = [1536, 1536]
authoritative_multilayer_shape_yx = [2688, 2688]
# Physical support reserved around registered regions for a broad illumination
# envelope and its frozen Gaussian grid.  This adds knots to global/wide tiles;
# the dense four-repeat multilayer tile remains below the 300k LOD limit.
atlas_support_margin_m = 32e-9

[sample.certificate]
source = "nominal; replace with the specimen-specific certificate"
# Nominal 1.18 x 40k detector field; keeps registered features and support in a
# nanoscale atlas. Replace together with the specimen-specific coordinate map.
field_width_m = 415.36e-9
si_layer_width_m = 13e-9
sige_layer_width_m = 10e-9
layer_width_standard_uncertainty_m = 0.25e-9
interface_width_m = 1.0e-9
layer_phase_step_rad = 0.06
layer_log_field_amplitude_step = 0.035
si_111_spacing_m = 0.31356e-9
lattice_spacing_standard_uncertainty_m = 0.00005e-9
# A 40 nm nominal calibration hole fits inside this nanoscale field. The old
# 0.1 mm placeholder was physically incompatible with the atlas.
perforation_diameter_m = 40e-9
si_plane_hkl = [1, 1, 1]
si_zone_axis_uvw = [1, -1, 0]
multilayer_repeat_count = 8
multilayer_region_count = 4
# Boundary coordinates are relative to the start of each registered stack;
# uncertainties are one-standard-deviation certificate values.
layer_boundary_coordinates_m = [10e-9, 23e-9, 33e-9, 46e-9, 56e-9, 69e-9, 79e-9, 92e-9, 102e-9, 115e-9, 125e-9, 138e-9, 148e-9, 161e-9, 171e-9, 184e-9]
layer_boundary_standard_uncertainties_m = [0.25e-9, 0.353553390593e-9, 0.433012701892e-9, 0.5e-9, 0.559016994375e-9, 0.612372435696e-9, 0.661437827766e-9, 0.707106781187e-9, 0.75e-9, 0.790569415042e-9, 0.829156197589e-9, 0.866025403784e-9, 0.901387818866e-9, 0.935414346693e-9, 0.968245836552e-9, 1.0e-9]

[experiment]
magnifications = [40000.0, 80000.0, 150000.0, 300000.0, 600000.0]
controllable_lenses = ["CL1", "CL3", "C-mini", "IL1", "IL2", "IL3", "PL1"]
fixed_control_lenses = ["Obj-prefield", "Obj-post"]
# These broad synthetic coordinates are only a branch-search box for the
# unscaled draft DAC laws below.  They are not a proposed NEOARM command range:
# replace them with measured safe limits and a mode-continuation trajectory.
# A mode is accepted only when it reaches the requested |A| and drives the
# sample-to-detector angle-to-position block B below the declared tolerance.
nominal_dac_search_bounds = [-200.0, 200.0]
nominal_dac_search_points = 4097
nominal_dac_multistart_points = 65
nominal_conjugacy_b_atol_m = 1.0e-6
# Absolute step in the dimensionless normalized raw-DAC coordinate used by the
# synthetic column.  Replace this number only after mapping the instrument DAC
# command range into the same coordinate.
single_lens_raw_dac_step = 0.015
# Precondition every synthetic channel this far below/above its endpoint before
# a forward/reverse approach.  These are dimensionless normalized raw-DAC
# coordinates, not current fractions.
approach_precondition_raw_dac_step = 0.05
approach_ramp_steps = 8
settling_time_s = 2.0
# Explicit synthetic mismatch used only by the fast surrogate; the physical
# hard-edge model is history-free until real hysteresis data justify a law.
reverse_approach_flux_factor = 0.997
d_optimal_state_count = 8
held_out_state_count = 3
expected_frame_count = 230
gaussian_centres_per_shortest_period = 8.0
gaussian_overlap_factor = 2.0
local_phase_residual_limit_rad = 0.1
local_log_amplitude_residual_limit = 0.02
detector_model_rms_noise_limit = 0.2
observable_model_uncertainty_limit = 0.2
parameter_refinement_sigma_limit = 0.1

# Compact reconnaissance: nine CL1 values, with a signed CL3 wobble at every
# value, locate a critical line in 18 images.  Up to three additional paired
# bisection measurements refine the root, for 24 images total.  This replaces
# a large two-dimensional current sweep and records only normalized raw DAC.
[experiment.condenser_reconnaissance]
scan_channel = "CL1"
wobble_channel = "CL3"
scan_half_width_raw_dac = 0.35
scan_point_count = 9
wobble_step_raw_dac = 0.015
maximum_root_refinement_pairs = 3

[lenses.CL1]
z_center_m_initial = 0.2000
thickness_m_initial = 0.020
q_bias_initial = 0.20
q_slope_per_dac_initial = 0.55
control_fixed = false

[lenses.CL3]
z_center_m_initial = 0.2400
thickness_m_initial = 0.015
q_bias_initial = 0.15
q_slope_per_dac_initial = 0.65
control_fixed = false

[lenses.C-mini]
z_center_m_initial = 0.3000
thickness_m_initial = 0.008
q_bias_initial = 0.10
q_slope_per_dac_initial = 0.45
control_fixed = false

[lenses.Obj-prefield]
z_center_m_initial = 0.3200
thickness_m_initial = 0.004
q_bias_initial = 0.75
q_slope_per_dac_initial = 0.0
control_fixed = true

[lenses.Obj-post]
z_center_m_initial = 0.3273
thickness_m_initial = 0.004
q_bias_initial = -0.75
q_slope_per_dac_initial = 0.0
control_fixed = true

[lenses.IL1]
z_center_m_initial = 0.5385239553839318
thickness_m_initial = 0.020
