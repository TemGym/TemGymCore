name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
    tags:
      - 'v[0-9]*'
  pull_request:

concurrency: 
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        python:
          - version: "3.11"
            toxenv: py311
          - version: "3.12"
            toxenv: py312
          - version: "3.13"
            toxenv: py313
          - version: "3.14"
            toxenv: py314
          # - version: "3.15"
          #   toxenv: py315
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Choose Python version ${{ matrix.python.version }}
        uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python.version }}'
          cache: 'pip'
      - name: install tox
        run: python3 -m pip install tox tox-uv
      - name: run tox
        run: tox -e '${{ matrix.python.toxenv }}'
      # - name: submit code coverage
      #   uses: codecov/codecov-action@v4
      #   env:
      #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  mc-tests:
    strategy:
      matrix:
        python_version: ["3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Choose Python version ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python_version }}'
          cache: 'pip'
      - name: install uv
        run: python3 -m pip install uv
      - name: install core
        run: uv pip install --system .
      - name: checkout mc
        run: git clone -b main --single-branch https://github.com/LiberTEM/Microscope-Calibration.git
      - name: install mc + test
        working-directory: ./Microscope-Calibration
        run: |
          uv pip install --system .[test,common,diffraction,gui]
          pytest tests/
