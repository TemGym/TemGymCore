name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff check .

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Test (CPU; GPU and slow tests run in their own workflows)
        run: pytest -m "not gpu and not slow" --cov=temgym_core --cov-report=xml -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install the oldest allowed runtime dependencies
        run: uv pip install --system --resolution lowest-direct -e .
      - name: Add the test tools (already-satisfied runtime packages are kept)
        run: uv pip install --system -e ".[dev]"
      - name: Test
        run: pytest -m "not gpu and not slow" -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Wheel and sdist stay small (PyPI rejects files over 100 MB)
        run: |
          find dist -type f -size +20M -print -exec false {} +
      - name: Install the wheel into an empty environment and import every module
        run: |
          uv venv clean-env
          uv pip install --python clean-env/bin/python dist/*.whl
          clean-env/bin/python tools/smoke_imports.py
      - name: With the plot extra every module must import
        run: |
          uv pip install --python clean-env/bin/python "matplotlib>=3.8"
          clean-env/bin/python tools/smoke_imports.py --strict
