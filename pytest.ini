[pytest]
testpaths = tests
norecursedirs = .git .tox *.egg-info build TOXENV
addopts = --strict-markers
markers =
    gpu: needs a verified Pallas GPU backend; run with JAX_PLATFORMS=cuda
    slow: takes more than about 30 s on CPU
    fem: needs the [fem] extra (jax-fem and its meshing dependencies)
    jet: needs the [jet] extra (jet-array)
