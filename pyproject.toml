[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/temgym_core",
]
only-packages = true

[tool.hatch.build.targets.wheel.force-include]
"src/temgym_core/calibration/presets" = "temgym_core/calibration/presets"

[project]
name = "temgym-core"
version = "0.0.1"
authors = [
  { name="David Landers", email="davidlandersresearch@gmail.com" },
  { name="Matthew Bryan", email="matthewbryan52@gmail.com" },
  { name="Dieter Weber", email="d.weber@fz-juelich.de" },
]
description = "An differentiable TEM ray tracing package"
readme = "README.md"
keywords=["electron microscopy", "virtual twin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11", 
    "Programming Language :: Python :: 3.12", 
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  'ase',
  # ``cubic2`` coefficient and derivative behaviour is part of the calibrated
  # sample contract.  Change this pin only together with the spline tests.
  'interpax==0.3.14',
  # The Gaussian Pallas kernel and cubic-sample derivatives are tested against
  # this JAX release. Keep the CPU/GPU extras on the same version.
  'jax==0.10.2',
  'jax_dataclasses',
  # NumPy 2.5 currently breaks the jaxtyping version pulled by interpax 0.3.14.
  'numpy<2.5',
  'numba',
  'scipy',
  'tomli; python_version < "3.11"',
  'typing-extensions',
]

[project.optional-dependencies]
inversion = [
  'ipykernel>=6',
  'ipywidgets>=8,<9',
  'ipympl>=0.10,<0.11',
  'matplotlib>=3.8',
  'nbclient>=0.10',
  'nbformat>=5.9',
]
gpu = [
  # Linux CUDA 13 wheels support both x86_64 and aarch64. Install this extra
  # for GPU Gaussian forward renders.
  'jax[cuda13]==0.10.2; sys_platform == "linux"',
]

[project.urls]
"Homepage" = "https://github.com/TemGym/TemGymCore"

