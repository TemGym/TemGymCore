[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/temgym_core",
]
only-packages = true

[tool.hatch.version]
source = "vcs"

[project]
name = "temgym-core"
dynamic = ["version"]
authors = [
  { name="David Landers", email="davidlandersresearch@gmail.com" },
  { name="Matthew Bryan", email="matthewbryan52@gmail.com" },
  { name="Dieter Weber", email="d.weber@fz-juelich.de" },
]
description = "An differentiable TEM ray tracing package"
readme = "README.md"
license-files = ["LICENSE.md"]
license = "GPL-3.0-only"
keywords=["electron microscopy", "virtual twin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
  'jax',
  'jax_dataclasses',
  'numpy',
  'numba',
  'typing-extensions',
]

[project.urls]
"Homepage" = "https://github.com/TemGym/TemGymCore"

